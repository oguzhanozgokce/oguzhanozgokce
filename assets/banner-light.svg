<clipPath id="l0"><rect class="type t0" x="744" y="110" width="222.7" height="26"/></clipPath><clipPath id="l1"><rect class="type t1" x="744" y="137" width="295.0" height="26"/></clipPath><clipPath id="l2"><rect class="type t2" x="744" y="164" width="204.7" height="26"/></clipPath><clipPath id="l3"><rect class="type t3" x="744" y="191" width="331.1" height="26"/></clipPath><clipPath id="l4"><rect class="type t4" x="744" y="218" width="349.1" height="26"/></clipPath><clipPath id="l5"><rect class="type t5" x="744" y="245" width="15.0" height="26"/></clipPath>
</defs>
<style>
.name{font:700 58px -apple-system, BlinkMacSystemFont, 'Segoe UI', 'Noto Sans', Helvetica, Arial, sans-serif;letter-spacing:-1.5px;fill:#1b1b1b}
.handle{font:500 15px ui-monospace, SFMono-Regular, 'SF Mono', Menlo, Consolas, 'Liberation Mono', monospace;fill:#6c687a}
.prompt{font:600 26px ui-monospace, SFMono-Regular, 'SF Mono', Menlo, Consolas, 'Liberation Mono', monospace;fill:#6437db}
.roletext{font:600 26px ui-monospace, SFMono-Regular, 'SF Mono', Menlo, Consolas, 'Liberation Mono', monospace;fill:#1b1b1b}
.meta{font:500 15px ui-monospace, SFMono-Regular, 'SF Mono', Menlo, Consolas, 'Liberation Mono', monospace;fill:#6c687a}
.code{font:500 15px ui-monospace, SFMono-Regular, 'SF Mono', Menlo, Consolas, 'Liberation Mono', monospace;fill:#2b2836}
.ln{font:500 13px ui-monospace, SFMono-Regular, 'SF Mono', Menlo, Consolas, 'Liberation Mono', monospace;fill:#6c687a;opacity:.55}
.file{font:500 13px ui-monospace, SFMono-Regular, 'SF Mono', Menlo, Consolas, 'Liberation Mono', monospace;fill:#6c687a}
.k{fill:#6437db}.f{fill:#6437db}.s{fill:#9c3660}.p{fill:#6c687a}.t{fill:#2b2836}
.type{transform-box:fill-box;transform-origin:left center}
.role{animation:type 1.1s steps(18,end) .25s both}
.t0{animation:type 0.53s steps(24,end) 0.9s both}.t1{animation:type 0.7s steps(32,end) 1.51s both}.t2{animation:type 0.48s steps(22,end) 2.29s both}.t3{animation:type 0.79s steps(36,end) 2.85s both}.t4{animation:type 0.84s steps(38,end) 3.72s both}.t5{animation:type 0.15s steps(1,end) 4.64s both}
.cursor{fill:#6437db;animation:move 1.1s steps(18,end) .25s both,blink 1.1s steps(1,end) 1.4s infinite}
.g1{animation:drift1 16s ease-in-out infinite alternate}
.g2{animation:drift2 20s ease-in-out infinite alternate}
.rise{animation:rise .7s cubic-bezier(.2,.7,.2,1) both}
.card{animation:rise .8s cubic-bezier(.2,.7,.2,1) .35s both}
@keyframes type{from{transform:scaleX(0)}to{transform:scaleX(1)}}
@keyframes move{from{transform:translateX(0)}to{transform:translateX(281.9px)}}
@keyframes blink{0%,100%{opacity:1}50%{opacity:0}}
@keyframes drift1{from{transform:translate(0,0)}to{transform:translate(110px,40px)}}
@keyframes drift2{from{transform:translate(0,0)}to{transform:translate(-130px,-30px)}}
@keyframes rise{from{opacity:0;transform:translateY(14px)}to{opacity:1;transform:translateY(0)}}
@media (prefers-reduced-motion:reduce){*{animation:none!important}.cursor{transform:translateX(281.9px)}}
</style>
