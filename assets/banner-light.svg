<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 320" width="1200" height="320" role="img" aria-labelledby="title desc">
<title id="title">Oğuzhan Özgökce, Software Developer</title>
<desc id="desc">Banner with the name Oğuzhan Özgökce, the title Software Developer and a short Kotlin snippet: role Software Developer, company Midas, focus Android, Kotlin and AI, mindset research and creativity.</desc>
<defs>
